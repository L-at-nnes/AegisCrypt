[package]
name = "aegiscrypt"
version = "1.0.0"
edition = "2021"
description = "AegisCrypt - secure file and folder encryption tool"

[[bin]]
name = "AegisCrypt"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"

[dependencies]
aes-gcm = { version = "0.10", features = ["std", "stream"] }
argon2 = "0.5"
rand = "0.8"
walkdir = "2"
eframe = "0.29"
rfd = "0.15"
zeroize = "1"
dirs = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[build-dependencies]
winresource = "0.1"
